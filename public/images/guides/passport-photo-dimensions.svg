<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" role="img" aria-labelledby="t d">
  <title id="t">U.S. passport photo dimensions</title>
  <desc id="d">A 2 by 2 inch square photo. The head, measured from the bottom of the chin to the top of the hair, must be between 1 and 1 3/8 inches tall.</desc>
  <rect width="700" height="520" fill="#ffffff"/>
  <g transform="translate(120 40)">
    <rect x="0" y="0" width="400" height="400" fill="#f8f9fb" stroke="#141922" stroke-width="2"/>
    <ellipse cx="200" cy="175" rx="82" ry="108" fill="#d1d5de"/>
    <path d="M60 400c8-80 66-118 140-118s132 38 140 118Z" fill="#d1d5de"/>
    <line x1="200" y1="0" x2="200" y2="400" stroke="#2050e0" stroke-dasharray="6 6"/>
    <line x1="-20" y1="67" x2="420" y2="67" stroke="#2050e0" stroke-dasharray="6 6"/>
    <line x1="-20" y1="283" x2="420" y2="283" stroke="#2050e0" stroke-dasharray="6 6"/>
    <g stroke="#141922" stroke-width="2" fill="none">
      <path d="M440 67v216M432 67h16M432 283h16"/>
      <path d="M0 430h400M0 422v16M400 422v16"/>
    </g>
    <g font-family="system-ui, sans-serif" font-size="18" fill="#141922">
      <text x="452" y="170">Head</text>
      <text x="452" y="194">1 – 1⅜ in</text>
      <text x="452" y="218" fill="#5b6170">25 – 35 mm</text>
      <text x="200" y="462" text-anchor="middle">2 in (51 mm)</text>
      <text x="-12" y="60" text-anchor="end" font-size="14" fill="#5b6170">Top of hair</text>
      <text x="-12" y="298" text-anchor="end" font-size="14" fill="#5b6170">Bottom of chin</text>
    </g>
  </g>
</svg>
